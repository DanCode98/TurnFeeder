<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gestión de Turnos</title>
    <link rel="icon" href="assets/img/logo.jpeg" type="image/jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">

</head>

<body>
    <div class="formulario-contenedor">
        <div class="formulario-titulo">
            <div class="logo-contenedor">
                <img src="assets/img/logo.jpeg" alt="Logo" class="logo">
            </div>
            <h2>Registro</h2>
            <p>Completa el formulario para registrarte</p>
        </div>

        <form id="formularioRegistro">
            <div class="form-group">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre"
                    placeholder="Ingresa tu nombre completo" required>
            </div>

            <div class="form-group">
                <label for="telefono" class="form-label">Número de Teléfono</label>
                <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej: 4949412345"
                    required>
            </div>

            <button type="submit" class="btn-enviar">Enviar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('formularioRegistro').addEventListener('submit', function (e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            console.log('Registro enviado:', { nombre, telefono });
            alert('¡Registro enviado correctamente!');
            this.reset();
        });
    </script>
</body>

</html>
